server:
  port: 8082

spring:
  application:
    name: genre
  profiles:
    active: "prod"
  config:
    import: "optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}"
  #  rabbitmq:
  #    host: "${RABBITMQ_HOST:localhost}"
  #    port: 5672
  #    username: "guest"
  #    password: "guest"
  datasource:
    url: 'jdbc:h2:mem:genredb'
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  cloud:
    config:
      enabled: true
    discovery:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: '*'